[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "string-metric-rl"
version = "0.1.0"
description = "Reinforcement Learning framework for string distance optimization and intelligent text editing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Abolfazl Abbasi", email = "a.abbasi5775@gmail.com" }
]
keywords = [
    "reinforcement-learning",
    "string-metrics",
    "edit-distance",
    "dqn",
    "q-learning",
    "arabic-nlp",
    "levenshtein",
    "pytorch"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "Levenshtein>=0.23.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.35.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arabic_rl_editor*"]
